[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lacedaemon-economy"
version = "2.0.0"
description = "A compact Economy++ backend, Discord bot, and Minecraft plugin contract."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9",
    "discord.py>=2.4",
    "fastapi>=0.110",
    "pydantic>=2",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27",
    "pytest>=8",
]

[project.scripts]
lacedaemon-bot = "lacedaemon.bot:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/lacedaemon"]
